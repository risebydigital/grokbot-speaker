[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gva"
version = "0.1.0"
description = "Grok Voice Assistant speaker runtime for a Raspberry Pi."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — Rise By Digital internal" }
authors = [{ name = "Rise By Digital" }]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "jsonschema>=4.22",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pyjwt>=2.8",
    "pyyaml>=6.0",
    "typer>=0.12",
    "tzdata>=2024.1",
    "uvicorn>=0.30",
    "websockets>=12",
]

[project.optional-dependencies]
voice = [
    "faster-whisper>=1.0.3",
    "openwakeword>=0.6.0",
    "piper-tts>=1.2.0",
    "sounddevice>=0.4.6",
]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[project.scripts]
gva = "gva.cli:main"

[tool.setuptools.packages.find]
include = ["gva*"]

[tool.setuptools.package-data]
gva = ["telemetry/event-1.0.0.json", "prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["gva", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
