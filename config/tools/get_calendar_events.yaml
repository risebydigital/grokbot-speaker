name: get_calendar_events
description: >
  No calendar is connected. Call this when asked about plans, meetings,
  diaries, or reports that are due. The result is an error, calendar not
  connected. Say that plainly in one sentence. Do not invent events.
timeout_s: 5
risk: low
personal_data: true
parameters:
  type: object
  additionalProperties: false
  properties:
    range:
      type: string
      enum: [today, tomorrow, tomorrow_morning, week]
      description: When to look. Defaults to today.
