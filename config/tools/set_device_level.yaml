name: set_device_level
description: >
  Set the level of a dimmable device, from 0 to 100. Only use a device id that
  supports levels. Not for simple on/off (use switch_device).
timeout_s: 5
risk: medium
personal_data: false
parameters:
  type: object
  additionalProperties: false
  required: [device, level]
  properties:
    device:
      type: string
    level:
      type: integer
      minimum: 0
      maximum: 100
